[package]
name = "mabel-cli"
description = "The mabel command line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "mabel"
path = "src/main.rs"

[dependencies]
mabel-core.workspace = true
mabel-net.workspace = true
mabel-node.workspace = true
mabel-proto.workspace = true
anyhow.workspace = true
clap.workspace = true
data-encoding.workspace = true
getrandom.workspace = true
iroh-base.workspace = true
qrcode.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
tempfile.workspace = true
# The network tests build the `--peer` ticket they hand the binary, which is
# the only way a relay-disabled peer is dialable in a test.
iroh-tickets.workspace = true
