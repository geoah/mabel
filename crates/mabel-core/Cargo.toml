[package]
name = "mabel-core"
description = "Ledger semantics: canonical encoding, wire-format validation, digests, verification fold"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
serde = ["dep:serde"]
# Enables the ignored `gen_vectors` test that rewrites `test-vectors/`.
gen-vectors = []

# No Iroh networking, no tokio, no filesystem (proposal 001 section 7).
[dependencies]
mabel-proto.workspace = true
blake3.workspace = true
data-encoding.workspace = true
iroh-base.workspace = true
serde = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
data-encoding.workspace = true
mabel-proto.workspace = true
serde_json.workspace = true
