[package]
name = "mabel-node"
description = "Node home, storage, wallet and witness runtimes, HTTP API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
mabel-core = { workspace = true, features = ["serde"] }
mabel-net.workspace = true
mabel-proto.workspace = true
anyhow.workspace = true
axum.workspace = true
data-encoding.workspace = true
getrandom.workspace = true
# The DNS hostname check of proposal 003 section 2. Declared here rather than
# in the workspace table because it is the only crate that resolves anything.
hickory-resolver = "0.26.1"
iroh.workspace = true
iroh-base.workspace = true
# `GET /api/resolve?input=` decodes its one parameter exactly once (proposal
# 006 section 7). Already in the tree behind axum; named here because this
# crate calls it directly rather than through an extractor.
percent-encoding = "2.3.2"
rust-embed.workspace = true
sha2.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "signal", "sync"] }
tracing.workspace = true

[dev-dependencies]
# The retired tag-11 signing path, so the tests can build a pre-006 chain and
# check that a legacy witness list still folds, still lists and still reads
# (proposal 006 section 1). No shipped code path reaches it.
mabel-core = { workspace = true, features = ["serde", "legacy-witness-config"] }
tempfile.workspace = true
# `start_paused` runs the graph crawler's whole-run budget on a test clock, so
# the time cap is exercised without a real sleep (ticket 025).
tokio = { workspace = true, features = ["test-util"] }
# `ServiceExt::oneshot` drives the routers in the contract tests without a
# socket. Declared here rather than in the workspace table because it is the
# only crate that needs it.
tower = { version = "0.5.3", features = ["util"] }
