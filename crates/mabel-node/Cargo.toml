[package]
name = "mabel-node"
description = "Node home, storage, wallet and witness runtimes, HTTP API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
mabel-core = { workspace = true, features = ["serde"] }
mabel-net.workspace = true
mabel-proto.workspace = true
anyhow.workspace = true
axum.workspace = true
data-encoding.workspace = true
getrandom.workspace = true
iroh.workspace = true
iroh-base.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "signal", "sync"] }
tower-http.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
# `ServiceExt::oneshot` drives the routers in the contract tests without a
# socket. Declared here rather than in the workspace table because it is the
# only crate that needs it.
tower = { version = "0.5.3", features = ["util"] }
