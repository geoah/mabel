name: release

# Two triggers, one pipeline. A push to main derives the next version from the
# conventional commits since the last release, writes it into the manifests as a
# release commit, tags it and publishes it. A hand-pushed v<x>.<y>.<z> tag
# publishes exactly that version through the same jobs.
on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

# One release at a time for the whole repository, not per ref: two quick pushes
# to main must not both be computing the next version, and a push must not race
# a hand-pushed tag for the `latest` image tag. Runs queue rather than cancel.
concurrency:
  group: release
  cancel-in-progress: false

# No token for any job unless the job asks for it below.
permissions: {}

env:
  IMAGE: ghcr.io/geoah/mabel
  CARGO_TERM_COLOR: always
  # `ui/` carries playwright as a dev dependency and the release bundle needs
  # no browsers, so `npm ci` must not download them.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  # Pinned so a CLI release cannot change what this workflow produces. app.yml
  # pins the same version for its iOS job.
  TAURI_CLI_VERSION: 2.11.4

jobs:
  # Decide the version, write it into the manifests, tag it. Every job below
  # builds from the tag this job pushes, so the binary's `--version`, the
  # tarball name, the image tag and the release tag cannot disagree.
  version:
    # The release commit is pushed with GITHUB_TOKEN, and GitHub starts no
    # workflow run for a GITHUB_TOKEN push. This check and the `[skip ci]` in
    # the commit body are the second and third stop on the same loop.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      name: ${{ steps.resolve.outputs.name }}
      sha: ${{ steps.resolve.outputs.sha }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
    steps:
      # Full history and all tags: the bump is computed from the commits since
      # the last release tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve, write and tag the version
        id: resolve
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # A hand-pushed tag is the version. The manifests have to say so
            # already, or the tarballs and the binary would report a different
            # version than the release they are attached to.
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
            scripts/version.sh check "$version"
            sha="$GITHUB_SHA"
          else
            version=$(scripts/version.sh next)
            tag="v${version}"

            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "tag $tag already exists: nothing to release from here" >&2
              exit 1
            fi

            # Whoever pushed later releases these commits, so stop instead of
            # forcing a non-fast-forward push.
            tip=$(git ls-remote origin refs/heads/main | cut -f1)
            if [ "$tip" != "$GITHUB_SHA" ]; then
              echo "main moved past $GITHUB_SHA while this run started;" >&2
              echo "the run for the newer commit releases these commits" >&2
              exit 1
            fi

            scripts/version.sh set "$version"

            git config user.name 'github-actions[bot]'
            git config user.email \
              '41898282+github-actions[bot]@users.noreply.github.com'
            git commit --quiet --all --message "chore(release): ${tag}" \
              --message '[skip ci]'
            git tag "$tag"
            # Atomic, so a rejected branch push cannot leave a tag behind that
            # points at a commit main never took.
            git push --atomic origin "HEAD:refs/heads/main" "refs/tags/${tag}"

            sha=$(git rev-parse HEAD)
          fi

          short_sha=$(git rev-parse --short=7 "$sha")

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "name=$tag ($short_sha)"
            echo "sha=$sha"
            echo "short_sha=$short_sha"
          } >> "$GITHUB_OUTPUT"

          echo "releasing $tag from $short_sha"

  # One set of steps for both targets. macos-latest is arm64, so both binaries
  # are native builds and neither needs a cross toolchain.
  binaries:
    needs: version
    # A codesign that cannot find its identity prompts, which on a runner
    # is a silent hang; the timeout turns that into a failure.
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            asset: x86_64-linux
          - os: macos-latest
            asset: aarch64-macos
    runs-on: ${{ matrix.os }}
    steps:
      # The tag, not the pushed commit: the release commit is what carries the
      # version being built.
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.version.outputs.tag }}

      # Early, so the log says whether this tarball will be signed before the
      # build spends ten minutes. It is all six secrets or none: signing
      # without notarizing is not a useful state, because Gatekeeper refuses a
      # signed but un-notarized download just as it refuses an unsigned one.
      # The step prints secret names, never secret values, and does nothing on
      # the linux leg.
      - name: Check for the Apple signing secrets
        if: matrix.os == 'macos-latest'
        id: signing
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -eu
          missing=""
          [ -n "${CERTIFICATE:-}" ] || missing="$missing APPLE_CERTIFICATE"
          [ -n "${CERTIFICATE_PASSWORD:-}" ] ||
            missing="$missing APPLE_CERTIFICATE_PASSWORD"
          [ -n "${SIGNING_IDENTITY:-}" ] ||
            missing="$missing APPLE_SIGNING_IDENTITY"
          [ -n "${API_ISSUER:-}" ] || missing="$missing APPLE_API_ISSUER"
          [ -n "${API_KEY:-}" ] || missing="$missing APPLE_API_KEY"
          [ -n "${API_KEY_CONTENT:-}" ] ||
            missing="$missing APPLE_API_KEY_CONTENT"
          if [ -z "$missing" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Signing and notarizing the macOS binary."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The macOS tarball is unsigned because no signing" \
              "secrets are set. Missing:$missing. Gatekeeper refuses an" \
              "unsigned download."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install the Rust toolchain
        run: |
          set -euo pipefail
          # The runner images ship a stable Rust, but the workspace needs
          # rust-version 1.91 and edition 2024, so ask rustup for current
          # stable. It is a no-op when the image is already there.
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      # First, because `cargo build --release` embeds ui/dist into the binary
      # with rust-embed. The embed is declared allow_missing, so building in the
      # other order silently ships a binary that answers `ui_not_built`.
      - name: Build the UI bundle
        working-directory: ui
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test -f dist/index.html

      - name: Build the release binary
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cargo build --release --locked --package mabel-cli
          reported=$(./target/release/mabel --version)
          echo "$reported"
          # The tag names the version, so the binary has to report it.
          printf '%s\n' "$reported" | grep -qF " ${VERSION}"

      - name: Sign the macOS binary
        # The app build lets tauri do this; a plain cargo build has nobody to
        # do it, so this is the keychain dance by hand. The keychain lives
        # under RUNNER_TEMP with a throwaway password and is deleted in the
        # cleanup step below. `--options runtime` is the hardened runtime and
        # `--timestamp` is a secure timestamp from Apple; notarization refuses
        # a signature that lacks either.
        if: >-
          matrix.os == 'macos-latest' &&
          steps.signing.outputs.enabled == 'true'
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          umask 077

          keychain="$RUNNER_TEMP/mabel-signing.keychain-db"
          password=$(openssl rand -base64 24)
          printf '%s' "$CERTIFICATE" | base64 --decode \
            > "$RUNNER_TEMP/certificate.p12"

          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # Without the partition list codesign asks for the keychain
          # interactively, and a prompt on a runner is a hang until the
          # timeout. The search list has to name the keychain too, or codesign
          # looks in the login keychain only and finds no identity. Replacing
          # the list is safe here: nothing else in this job reads a keychain.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain"
          rm -f "$RUNNER_TEMP/certificate.p12"

          codesign --force --options runtime --timestamp \
            --sign "$SIGNING_IDENTITY" target/release/mabel
          codesign --verify --strict --verbose=2 target/release/mabel

      - name: Notarize the macOS binary
        # notarytool takes a zip, a dmg or a pkg, so the signed binary is
        # submitted inside a zip. Nothing is stapled afterwards: a stapled
        # ticket lives in a bundle's or a disk image's metadata and a bare
        # mach-o has nowhere to keep one. The ticket exists on Apple's side, so
        # Gatekeeper looks it up over the network the first time the binary
        # runs, and a machine that is offline for that first run sees an
        # un-notarized binary. The dmg from the macos-app job is the download
        # that carries its ticket with it.
        #
        # The grep is belt and braces. `notarytool submit --wait` should
        # already exit non-zero on a rejected submission, and there is no
        # stapled ticket here to prove afterwards that it did, so the printed
        # status is checked as well.
        if: >-
          matrix.os == 'macos-latest' &&
          steps.signing.outputs.enabled == 'true'
        env:
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          umask 077

          # Outside the workspace, so no artifact can pick it up.
          key="$RUNNER_TEMP/apple-api-key.p8"
          printf '%s\n' "$API_KEY_CONTENT" > "$key"

          # ditto zips a directory, so the binary is copied into one first.
          src="$RUNNER_TEMP/notarize-src"
          zip="$RUNNER_TEMP/mabel-notarize.zip"
          rm -rf "$src"
          mkdir -p "$src"
          cp target/release/mabel "$src/mabel"
          ditto -c -k --sequesterRsrc "$src" "$zip"

          xcrun notarytool submit "$zip" \
            --key-id "$API_KEY" \
            --key "$key" \
            --issuer "$API_ISSUER" \
            --wait \
            --timeout 45m | tee "$RUNNER_TEMP/notarize.log"
          grep -q 'status: Accepted' "$RUNNER_TEMP/notarize.log"

      - name: Remove the signing keychain and the API key
        # `security delete-keychain` drops the keychain from the search list as
        # well as deleting the file.
        if: always() && matrix.os == 'macos-latest'
        run: |
          set -eu
          rm -rf "$RUNNER_TEMP/notarize-src"
          rm -f "$RUNNER_TEMP/certificate.p12" \
            "$RUNNER_TEMP/apple-api-key.p8" \
            "$RUNNER_TEMP/mabel-notarize.zip"
          keychain="$RUNNER_TEMP/mabel-signing.keychain-db"
          if [ -f "$keychain" ]; then
            security delete-keychain "$keychain" || true
          fi

      - name: Package the tarball
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          stem="mabel-${VERSION}-${ASSET}"
          mkdir -p "dist/${stem}"
          cp target/release/mabel "dist/${stem}/"
          cp README.md "dist/${stem}/"
          # LICENSE landed after this workflow did, so the copy stays guarded.
          if [ -f LICENSE ]; then
            cp LICENSE "dist/${stem}/"
          fi
          tar -czf "dist/${stem}.tar.gz" -C dist "${stem}"
          tar -tzf "dist/${stem}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.asset }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # The desktop app: a signed, notarized dmg and the same .app as a zip. Every
  # step is in .github/actions/macos-app, which app.yml's on-demand macOS job
  # calls with the same secrets, so the release build and a build off a branch
  # cannot drift. This is the canonical macOS app build; app.yml no longer
  # builds one on a push.
  macos-app:
    needs: version
    runs-on: macos-latest
    # Notarization is a round trip to Apple's notary service, which usually
    # answers in minutes but has no promised time.
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      signed: ${{ steps.build.outputs.signed }}
    steps:
      # The tag, not the pushed commit: the release commit is what writes the
      # version into tauri.conf.json, and the action fails the build when the
      # bundle reports anything else.
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.version.outputs.tag }}

      - name: Build the app
        id: build
        uses: ./.github/actions/macos-app
        with:
          version: ${{ needs.version.outputs.version }}
          tauri-cli-version: ${{ env.TAURI_CLI_VERSION }}
          apple-certificate: ${{ secrets.APPLE_CERTIFICATE }}
          apple-certificate-password: >-
            ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          apple-signing-identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          apple-api-issuer: ${{ secrets.APPLE_API_ISSUER }}
          apple-api-key: ${{ secrets.APPLE_API_KEY }}
          apple-api-key-content: ${{ secrets.APPLE_API_KEY_CONTENT }}

      - uses: actions/upload-artifact@v4
        with:
          name: app-macos
          path: |
            ${{ steps.build.outputs.dmg }}
            ${{ steps.build.outputs.app-zip }}
          if-no-files-found: error
          retention-days: 7

  # The image builds the UI in its own stage, so this job needs no node setup.
  # protoc comes from protoc-bin-vendored in mabel-proto's build.rs, so there is
  # no system protoc to install here or in the binary jobs.
  # One leg per platform, each on its native runner: a Rust release build
  # under qemu costs 20 to 40 extra minutes, and the arm64 runners are free
  # on a public repository. Each leg pushes by digest only; the docker-merge
  # job below stitches the digests into the one tagged index.
  docker:
    needs: version
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      SHA: ${{ needs.version.outputs.sha }}
      SOURCE: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      # The artifact name and the cache scope cannot carry a slash.
      - name: Name the platform pair
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      # The Dockerfile uses BuildKit cache mounts and this exports the layer
      # cache to the Actions cache, so a per-commit build reuses dependencies.
      # The scope is per platform so the two legs do not evict each other.
      - uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN with packages:write is the only credential ghcr needs.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No tags here: the leg pushes an untagged image by digest, and the
      # labels ride on each platform's manifest as before.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.revision=${{ env.SHA }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.source=${{ env.SOURCE }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docker-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=docker-${{ env.PLATFORM_PAIR }}

      # The digest travels to the merge job as an empty file named by the
      # digest, which is the shape a matrix can hand to one consumer.
      - name: Export the digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Stitches the two per-platform digests into one manifest index and tags
  # it. The per-manifest labels do not surface on an index, so the same three
  # values are set again as index annotations.
  docker-merge:
    needs: [version, docker]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      SHA: ${{ needs.version.outputs.sha }}
      SHORT_SHA: ${{ needs.version.outputs.short_sha }}
      SOURCE: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the index
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          # Two digests, one per leg; anything else means a leg went missing
          # and the index would quietly ship fewer platforms than the last
          # release did.
          refs=()
          for digest in *; do
            refs+=("$IMAGE@sha256:$digest")
          done
          if [ "${#refs[@]}" -ne 2 ]; then
            echo "expected 2 digests, found ${#refs[@]}: ${refs[*]}" >&2
            exit 1
          fi
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.revision=$SHA" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --annotation "index:org.opencontainers.image.source=$SOURCE" \
            -t "$IMAGE:$SHORT_SHA" -t "$IMAGE:$TAG" -t "$IMAGE:latest" \
            "${refs[@]}"

      # The check the change is for: the tag must answer as an index that
      # names both platforms.
      - name: Inspect the index
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE:$TAG"
          for platform in linux/amd64 linux/arm64; do
            docker buildx imagetools inspect "$IMAGE:$TAG" \
              --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}}{{"\n"}}{{end}}' \
              | grep -qx "$platform" || { echo "missing $platform" >&2; exit 1; }
          done

  release:
    needs: [version, binaries, macos-app, docker-merge]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history and all tags: the notes are the commits between the
      # previous release tag and this one.
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.version.outputs.tag }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: tarball-*
          merge-multiple: true

      # The dmg and the zipped .app, into the same directory as the tarballs.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          name: app-macos

      - name: Write the release notes
        env:
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ needs.version.outputs.sha }}
          SHORT_SHA: ${{ needs.version.outputs.short_sha }}
          SIGNED: ${{ needs.macos-app.outputs.signed }}
        run: |
          set -euo pipefail

          # Commit subjects are untrusted text. The script writes them to
          # stdout as data and never into a shell word, so a subject carrying
          # shell syntax stays a subject.
          scripts/release-notes.sh "$TAG" > notes.md

          # An unquoted heredoc, so the variables expand and the escaped
          # backticks stay literal. Only tags and shas reach it.
          cat >> notes.md <<EOF
          Commit \`$SHORT_SHA\` (\`$SHA\`).

          Container image:

          \`\`\`sh
          docker pull $IMAGE:$TAG
          \`\`\`

          The same image is tagged \`$TAG\`, \`$SHORT_SHA\` and \`latest\`.
          EOF

          # Say it on the release page rather than only in a build log: the
          # same six secrets sign the app and the macOS tarball, so one flag
          # describes both downloads.
          if [ "$SIGNED" != true ]; then
            cat >> notes.md <<'EOF'

          The macOS downloads are unsigned, because the Apple signing secrets
          are not set on this repository. Gatekeeper refuses an unsigned
          download.
          EOF
          fi

          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          NAME: ${{ needs.version.outputs.name }}
        run: |
          set -euo pipefail

          # Four assets, from three jobs: the two CLI tarballs, the dmg and
          # the .app as a zip. A missing one is a failed release rather than a
          # release that quietly ships less than the last one did.
          expect() {
            count=$(find dist -maxdepth 1 -name "$1" -type f | wc -l)
            if [ "$count" -ne "$2" ]; then
              echo "expected $2 of $1, found $count" >&2
              find dist -type f >&2
              exit 1
            fi
          }
          expect '*.tar.gz' 2
          expect '*.dmg' 1
          expect '*.zip' 1

          # The tag exists before any of this built, so the release needs no
          # --target and is never a prerelease.
          gh release create "$TAG" --title "$NAME" --notes-file notes.md \
            dist/*.tar.gz dist/*.dmg dist/*.zip
