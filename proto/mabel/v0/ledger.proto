// Normative schema for mabel ledger events (proposal 002, sections 7 and 8).
//
// Canonical encoding, required for every signed or hashed message:
//   - fields in ascending field-number order;
//   - minimal varints;
//   - no field set to its proto3 default value is serialized;
//   - each non-repeated field appears exactly once, and every field the
//     field-validation table (proposal 002 section 8, proposal 001
//     section 3.4) marks required is present;
//   - no packed repeated fields in signed messages.
//
// The encoded bytes are authoritative: they are hashed, signed, stored and
// shipped as-is, and are never re-serialized. Field numbers and oneof tags
// are append-only; a breaking change means a v1 directory, a new envelope
// version and a new ALPN. Proposal 002 section 7 rewrote this file in place
// once, an exception that expires with the first ledger created outside the
// test suite, and it is spent.
//
// `EventBody.payload` tags 10 to 19 are all spent (proposal 006 section 3):
// the next payload takes a number out of the block reserved for the deferred
// payloads of proposal 002 section 9.

syntax = "proto3";

package mabel.v0;

// What an identity says it is. Advisory: it never gates payload validity,
// authorization or any verification outcome (proposal 002 section 3).
enum DeclaredKind {
  KIND_UNSPECIFIED = 0;
  PERSON = 1;
  ORGANIZATION = 2;
  AGENT = 3;
  SERVICE = 4;
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  MEMBER = 1;
  CONTROLLER = 2;
}

// A self-keyed ledger: this key is a permanent CONTROLLER principal whose
// identity id is the ledger's own, and it is not removable in this POC.
message RawRoot {
  bytes active_key = 1;       // 32-byte ed25519 public key
  bytes reserve_commit = 2;   // BLAKE3("mabel/reserve/v0\n" || reserve pubkey)
}

// A ledger controlled by one founding identity, which holds no key of its
// own. Exactly one founder: a single-signature envelope cannot carry consent
// from several (proposal 002 section 2).
message IdentityRoot {
  bytes founder = 1;           // founding identity id, 32 bytes
  bytes founder_key = 2;       // founder active key, 32 bytes
  bytes founder_inception = 3; // founder's seq-0 SignedEvent bytes, <= 1024
}

message Inception {
  DeclaredKind kind = 1;      // advisory, must not be KIND_UNSPECIFIED
  bytes nonce = 2;            // 16 bytes
  oneof root {                // the ledger's one cryptographic root
    RawRoot raw_root = 10;
    IdentityRoot identity_root = 11;
  }
}

// Retired for writing and readable forever (proposal 006 section 1). The
// field holds raw Iroh endpoint ids, which is what it always physically was:
// endpoints that may hold this ledger. No node builds one; the fold accepts
// whatever a valid chain contains, and `WitnessSet` at tag 19 is what a
// ledger writes now.
message WitnessConfig {
  repeated bytes witnesses = 1; // 1..=16 distinct 32-byte Iroh EndpointIds
}

// The endpoints that answer for this identity, replaced whole by each event
// (proposal 006 section 2). Legal on every ledger: an identity that publishes
// one is directly fetchable with no witness at all. An empty list means
// nothing answers for this identity right now.
message EndpointAdvertisement {
  repeated bytes endpoints = 1; // 0..=8 distinct 32-byte Iroh endpoint ids
}

// The identities that may keep this ledger, replaced whole by each event
// (proposal 006 section 1). Each entry is an identity id, so a witness can
// move: replacing a machine is one event on the witness's own ledger. An
// empty list means nobody keeps this chain, and a ledger may name itself.
message WitnessSet {
  repeated bytes witnesses = 1; // 0..=16 distinct 32-byte identity ids
}

message TrustAttestation {
  bytes subject = 1;          // identity id, 32 bytes, differs from ledger id
}

message TrustRevocation {
  bytes target = 1;           // event id of an unrevoked TrustAttestation
}

// Membership is legal on every ledger (proposal 002 section 4).
message MembershipInvitation {
  bytes invitee = 1;          // invited identity id, 32 bytes
  bytes invitee_key = 2;      // invitee active key, 32 bytes
  Role role = 3;              // MEMBER or CONTROLLER
  bytes invitee_inception = 4; // invitee's seq-0 SignedEvent bytes, <= 1024
}

message MembershipAcceptance {
  bytes acceptance = 1;       // encoded Acceptance bytes, <= 1024
  bytes signature = 2;        // invitee signature over accept_input, 64 bytes
}

message MembershipRemoval {
  bytes target = 1;           // identity id of a principal or open invitee
}

// The ledger's public name, hostname and email, replaced whole by each event
// (proposal 003 section 1, proposal 005). An absent field means unset:
// clearing a field is a ProfileUpdate that omits it, and a ProfileUpdate
// omitting all three is a legal zero-length payload that clears all three. The
// codepoint policy and the hostname syntax are proposal 003 sections 1 and 2;
// the email rule is proposal 005.
message ProfileUpdate {
  string display_name = 1;    // <= 64 bytes UTF-8; absent means unset
  string hostname = 2;        // <= 246 bytes, lowercase LDH; absent means unset
  string email = 3;           // <= 254 bytes UTF-8; absent means unset
}

message EventBody {
  uint32 version = 1;         // 0, so absent under the canonical encoding
  bytes ledger = 2;           // 32 bytes; absent at seq 0
  uint64 seq = 3;             // 0-based, strictly +1 per event
  bytes prev = 4;             // previous event_id; absent at seq 0
  uint64 timestamp_ms = 5;    // unix ms, ledger order; 1..=4102444800000
  bytes author_key = 6;       // 32-byte ed25519 public key
  oneof payload {             // tags 10..=19, append-only and all spent
    Inception inception = 10;
    WitnessConfig witness_config = 11;
    TrustAttestation trust_attestation = 12;
    TrustRevocation trust_revocation = 13;
    MembershipInvitation membership_invitation = 14;
    MembershipAcceptance membership_acceptance = 15;
    MembershipRemoval membership_removal = 16;
    ProfileUpdate profile_update = 17;
    EndpointAdvertisement endpoint_advertisement = 18;
    WitnessSet witness_set = 19;
  }
  // Held for the deferred payloads of proposal 002 section 9.
  reserved 20 to 29;
}

message SignedEvent {
  bytes body = 1;             // the exact encoded EventBody bytes, <= 4096
  bytes signature = 2;        // 64-byte ed25519 signature over sign_input
}

// Detached invitee acceptance (proposal 001 section 3.5). Signed over
// accept_input = "mabel/accept/v0\n" || acceptance_bytes.
message Acceptance {
  uint32 version = 1;         // 0, so absent under the canonical encoding
  bytes ledger = 2;           // the inviting ledger id, 32 bytes
  bytes invitation_event = 3; // MembershipInvitation event id, 32 bytes
  bytes invitee = 4;          // invitee identity id, 32 bytes
  bytes invitee_key = 5;      // invitee active key, 32 bytes
}
