// File artifacts that cross machines (proposal 001 section 3.8). Each is
// subject to the wire-format validator, the field table and a size cap
// checked before allocation, exactly as network input.

syntax = "proto3";

package mabel.v0;

import "mabel/v0/ledger.proto";

message InvitationBundle {
  // ledger events 0..=invitation; file <= 1 MiB
  repeated SignedEvent ledger_prefix = 1;
}

message AcceptanceFile {
  bytes acceptance = 1; // encoded Acceptance bytes
  bytes signature = 2;  // invitee signature, 64 bytes; file <= 4 KiB
}

message IdentityDescriptor {
  SignedEvent inception = 1;    // the identity's seq-0 event
  repeated bytes witnesses = 2; // 32-byte EndpointIds; file <= 64 KiB
}
