[workspace]
resolver = "3"
members = [
    "crates/mabel-proto",
    "crates/mabel-core",
    "crates/mabel-net",
    "crates/mabel-node",
    "crates/mabel-cli",
]

[workspace.package]
version = "0.14.1"
edition = "2024"
rust-version = "1.91"
license = "MIT"

[workspace.dependencies]
mabel-proto = { path = "crates/mabel-proto" }
mabel-core = { path = "crates/mabel-core" }
mabel-net = { path = "crates/mabel-net" }
mabel-node = { path = "crates/mabel-node" }

anyhow = "1.0.104"
axum = "0.8.9"
blake3 = "1.8.7"
clap = { version = "4.6.6", features = ["derive"] }
data-encoding = "2.11.1"
getrandom = "0.4.3"
iroh = "1.0.3"
iroh-base = { version = "1.0.3", default-features = false, features = ["key"] }
iroh-tickets = "1.0.0"
prost = "0.14.4"
# The two QR encoders of proposal 006 section 7 come from one crate: the
# built-in unicode renderer draws the square `mabel identity share --qr` prints,
# and the `svg` feature draws the one the UI shows. `image` is left off: nothing
# here writes a raster.
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"
rust-embed = "8.12.0"
sha2 = "0.11.0"
tower-http = { version = "0.6.11", features = ["compression-br", "compression-gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = "1.53.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

assert_cmd = "2.2.2"
tempfile = "3.27.0"

[profile.release]
strip = true
